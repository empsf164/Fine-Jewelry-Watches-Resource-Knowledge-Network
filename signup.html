<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — AURELIS Knowledge Network</title>
  <meta name="description" content="Join AURELIS to personalize your fine jewelry and luxury watches knowledge feed and access downloadable checklists.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Theme Switcher in Top Right Corner -->
  <div class="auth-theme-corner-btn">
    <button type="button" class="btn-icon-action theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <!-- Standalone Authentication Layout -->
  <div class="auth-page-wrapper">
    <div class="container-custom" style="max-width: 560px;">
      <div class="p-4 p-md-5 bg-surface-custom border border-subtle-custom rounded shadow-lg">
        
        <!-- Brand Name Inside Box Top Center -->
        <div class="d-flex flex-column align-items-center text-center mb-4">
          <a href="index.html" class="brand-logo align-items-center mb-3 text-decoration-none" aria-label="Aurelis Homepage">
            <span class="brand-name">AURELIS</span>
            <span class="brand-tagline-micro">Knowledge Network</span>
          </a>
          <h3 class="mb-1">Create Your Account</h3>
          <p class="small text-secondary mb-0">Join the specialized knowledge network for collectors & artisans</p>
        </div>

        <form id="signupForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="aurelis-label" for="signupName">Full Name</label>
              <input type="text" id="signupName" class="aurelis-input" placeholder="e.g. Julian Vance" required>
            </div>
            
            <div class="col-md-6">
              <label class="aurelis-label" for="signupEmail">Email Address</label>
              <input type="email" id="signupEmail" class="aurelis-input" placeholder="julian@collector.org" required>
            </div>

            <div class="col-md-6">
              <label class="aurelis-label" for="signupPassword">Create Password</label>
              <div class="password-input-group">
                <input type="password" id="signupPassword" class="aurelis-input" placeholder="At least 8 characters" required minlength="8">
                <button type="button" class="btn-password-toggle" aria-label="Toggle password visibility" title="Toggle password visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="col-md-6">
              <label class="aurelis-label" for="signupConfirm">Confirm Password</label>
              <div class="password-input-group">
                <input type="password" id="signupConfirm" class="aurelis-input" placeholder="Repeat password" required minlength="8">
                <button type="button" class="btn-password-toggle" aria-label="Toggle password visibility" title="Toggle password visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <!-- Areas of Interest -->
            <div class="col-12 mt-4">
              <label class="aurelis-label mb-2"><i class="bi bi-stars text-bronze me-1"></i> Research Interests (Optional)</label>
              <div class="row g-2 font-ui small">
                <div class="col-6">
                  <label class="p-2 border border-subtle-custom rounded bg-secondary-custom d-flex align-items-center gap-2 cursor-pointer w-100">
                    <input type="checkbox" name="interest" value="Fine Jewelry" class="form-check-input mt-0" checked>
                    <span>Fine Jewelry</span>
                  </label>
                </div>
                <div class="col-6">
                  <label class="p-2 border border-subtle-custom rounded bg-secondary-custom d-flex align-items-center gap-2 cursor-pointer w-100">
                    <input type="checkbox" name="interest" value="Luxury Watches" class="form-check-input mt-0" checked>
                    <span>Luxury Watches</span>
                  </label>
                </div>
                <div class="col-6">
                  <label class="p-2 border border-subtle-custom rounded bg-secondary-custom d-flex align-items-center gap-2 cursor-pointer w-100">
                    <input type="checkbox" name="interest" value="Gemstones" class="form-check-input mt-0" checked>
                    <span>Gemstones & 4Cs</span>
                  </label>
                </div>
                <div class="col-6">
                  <label class="p-2 border border-subtle-custom rounded bg-secondary-custom d-flex align-items-center gap-2 cursor-pointer w-100">
                    <input type="checkbox" name="interest" value="Movements" class="form-check-input mt-0" checked>
                    <span>Watch Movements</span>
                  </label>
                </div>
                <div class="col-6">
                  <label class="p-2 border border-subtle-custom rounded bg-secondary-custom d-flex align-items-center gap-2 cursor-pointer w-100">
                    <input type="checkbox" name="interest" value="Precious Metals" class="form-check-input mt-0">
                    <span>Precious Metals</span>
                  </label>
                </div>
                <div class="col-6">
                  <label class="p-2 border border-subtle-custom rounded bg-secondary-custom d-flex align-items-center gap-2 cursor-pointer w-100">
                    <input type="checkbox" name="interest" value="Care & Restoration" class="form-check-input mt-0">
                    <span>Care & Restoration</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="col-12 mt-3">
              <label class="d-flex align-items-center gap-2 cursor-pointer small font-ui">
                <input type="checkbox" id="newsletterCheck" class="form-check-input mt-0" checked>
                <span>Receive monthly technical teardowns and alerts</span>
              </label>
            </div>

            <div class="col-12">
              <label class="d-flex align-items-center gap-2 cursor-pointer small font-ui">
                <input type="checkbox" id="termsCheck" class="form-check-input mt-0" required>
                <span>I agree to the <a href="about.html#terms" class="text-bronze">Editorial Terms</a> and <a href="about.html#privacy" class="text-bronze">Privacy Policy</a></span>
              </label>
            </div>

            <div class="col-12 mt-3">
              <button type="submit" class="btn-aurelis btn-aurelis-primary w-100 justify-content-center py-2">
                Create Account
              </button>
            </div>
          </div>
        </form>

        <!-- Social Divider -->
        <div class="auth-social-divider">
          <span>Or sign up with</span>
        </div>

        <!-- Google and Apple Social Buttons -->
        <div class="d-flex flex-column gap-2 mb-3">
          <button type="button" class="btn-social-auth" onclick="handleSocialAuth('Google')">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
              <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.1s.7 5.4 1.9 7.8l3.7-2.9z"/>
              <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z"/>
            </svg>
            <span>Continue with Google</span>
          </button>

          <button type="button" class="btn-social-auth" onclick="handleSocialAuth('Apple')">
            <i class="bi bi-apple fs-5"></i>
            <span>Continue with Apple</span>
          </button>
        </div>

        <div class="text-center pt-3 border-top border-subtle-custom small text-secondary">
          Already have an account? <a href="login.html" class="text-bronze fw-semibold">Sign In</a>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/favorites.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signupForm');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('signupName').value.trim();
          const email = document.getElementById('signupEmail').value.trim();
          const pass = document.getElementById('signupPassword').value;
          const confirmPass = document.getElementById('signupConfirm').value;

          if (pass !== confirmPass) {
            AurelisNotifications.show('Passwords do not match.', 'error');
            return;
          }

          const selectedInterests = Array.from(document.querySelectorAll('input[name="interest"]:checked')).map(cb => cb.value);

          AurelisAuth.signup(name, email, pass, selectedInterests);

          setTimeout(() => {
            window.location.href = 'explore.html';
          }, 800);
        });
      }
    });

    function handleSocialAuth(provider) {
      AurelisAuth.signup('Collector Member', `member@${provider.toLowerCase()}.com`, 'SocialAuthToken2026', ['Fine Jewelry', 'Luxury Watches']);
      setTimeout(() => {
        window.location.href = 'explore.html';
      }, 500);
    }
  </script>
</body>
</html>

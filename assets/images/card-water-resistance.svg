<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1722"/>
      <stop offset="50%" stop-color="#141E2D"/>
      <stop offset="100%" stop-color="#0A101A"/>
    </linearGradient>
    <linearGradient id="goldGradWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC298"/>
      <stop offset="50%" stop-color="#C8A67B"/>
      <stop offset="100%" stop-color="#9E7D52"/>
    </linearGradient>
    <linearGradient id="pressureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="url(#bgGradWater)"/>

  <!-- Technical Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.05" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="270"/>
    <line x1="160" y1="0" x2="160" y2="270"/>
    <line x1="320" y1="0" x2="320" y2="270"/>
    <line x1="440" y1="0" x2="440" y2="270"/>
    <line x1="0" y1="65" x2="480" y2="65"/>
    <line x1="0" y1="205" x2="480" y2="205"/>
  </g>

  <!-- Pressure Chamber Silhouette -->
  <circle cx="240" cy="135" r="95" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="240" cy="135" r="90" fill="url(#pressureGrad)"/>

  <!-- Watch Case Teardown Cross-Section -->
  <!-- Case Middle -->
  <circle cx="240" cy="135" r="62" fill="#141A24" stroke="url(#goldGradWater)" stroke-width="4"/>
  <!-- Dial & Bezel -->
  <circle cx="240" cy="135" r="48" fill="#0E121A" stroke="#C8A67B" stroke-width="1.5"/>
  <!-- Sapphire Crystal Highlight -->
  <path d="M 205 110 Q 240 100 275 110" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Gasket O-Rings (Red Nitrile Gaskets) -->
  <circle cx="240" cy="135" r="54" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Screw-Down Crown Assembly -->
  <g transform="translate(306, 135)">
    <!-- Stem Tube -->
    <rect x="0" y="-5" width="10" height="10" fill="#64748B"/>
    <!-- Crown -->
    <rect x="10" y="-12" width="16" height="24" rx="2" fill="url(#goldGradWater)" stroke="#C8A67B" stroke-width="1"/>
    <!-- Double O-Ring Seals in Tube -->
    <circle cx="4" cy="-2" r="2" fill="#EF4444"/>
    <circle cx="4" cy="2" r="2" fill="#EF4444"/>
  </g>

  <!-- Pressure Indicator Arrows -->
  <g stroke="#38BDF8" stroke-width="1.5" fill="none">
    <path d="M 240 25 L 240 40 M 236 34 L 240 40 L 244 34"/>
    <path d="M 240 245 L 240 230 M 236 236 L 240 230 L 244 236"/>
    <path d="M 120 135 L 135 135 M 129 131 L 135 135 L 129 139"/>
  </g>

  <!-- Dial Hands -->
  <line x1="240" y1="135" x2="240" y2="105" stroke="#DFC298" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="240" y1="135" x2="265" y2="135" stroke="#DFC298" stroke-width="2" stroke-linecap="round"/>
  <circle cx="240" cy="135" r="3" fill="#FFFFFF"/>

  <!-- Technical Readouts -->
  <text x="35" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" letter-spacing="1.5">HYDROSTATIC PRESSURE ARCHITECTURE</text>
  <text x="35" y="245" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">ISO 22810 / ISO 6425 • 200M / 20 BAR DIVER SPEC</text>
  <text x="445" y="245" font-family="'JetBrains Mono', monospace" font-size="10" fill="#DFC298" text-anchor="end">4K ULTRA HD</text>
</svg>

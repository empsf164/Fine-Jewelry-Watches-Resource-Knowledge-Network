<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="metal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181410" />
      <stop offset="100%" stop-color="#0a0806" />
    </linearGradient>
    <linearGradient id="gold-bar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#E2B714" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#7B5E07" />
    </linearGradient>
    <linearGradient id="plat-bar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
    <linearGradient id="rose-bar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBCFE8" />
      <stop offset="40%" stop-color="#F472B6" />
      <stop offset="80%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#metal-bg)" />

  <!-- Gold Bullion / Ingot 1 (18K 750 Yellow Gold) -->
  <g transform="translate(90, 100)">
    <polygon points="20,0 120,0 140,40 0,40" fill="url(#gold-bar)" stroke="#FDE047" stroke-width="1" />
    <polygon points="0,40 140,40 140,160 0,160" fill="url(#gold-bar)" opacity="0.9" />
    <rect x="25" y="65" width="90" height="70" rx="4" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <text x="70" y="95" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" text-anchor="middle">AU 750</text>
    <text x="70" y="118" fill="#FDE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">18K GOLD</text>
  </g>

  <!-- Platinum Ingot (Pt 950) -->
  <g transform="translate(250, 80)">
    <polygon points="20,0 120,0 140,40 0,40" fill="url(#plat-bar)" stroke="#FFF" stroke-width="1" />
    <polygon points="0,40 140,40 140,180 0,180" fill="url(#plat-bar)" opacity="0.9" />
    <rect x="25" y="75" width="90" height="70" rx="4" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.5)" stroke-width="1" />
    <text x="70" y="105" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" text-anchor="middle">PT 950</text>
    <text x="70" y="128" fill="#E5E7EB" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">PLATINUM</text>
  </g>

  <!-- Rose Gold Ingot (18K Rose) -->
  <g transform="translate(410, 100)">
    <polygon points="20,0 120,0 140,40 0,40" fill="url(#rose-bar)" stroke="#FBCFE8" stroke-width="1" />
    <polygon points="0,40 140,40 140,160 0,160" fill="url(#rose-bar)" opacity="0.9" />
    <rect x="25" y="65" width="90" height="70" rx="4" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <text x="70" y="95" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" text-anchor="middle">750 4N</text>
    <text x="70" y="118" fill="#FBCFE8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">ROSE GOLD</text>
  </g>

  <!-- Assay Stamping Authority Seal -->
  <circle cx="300" cy="315" r="22" fill="#1e1a14" stroke="#BD9865" stroke-width="1.5" />
  <text x="300" y="320" fill="#BD9865" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">ASSAY</text>
  <text x="300" y="360" fill="rgba(255,255,255,0.6)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">PRECIOUS METALS &amp; HALLMARK METALLURGY</text>
</svg>

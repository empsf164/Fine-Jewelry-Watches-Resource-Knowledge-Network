<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c22" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <linearGradient id="steel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>
    <radialGradient id="jewel-ruby" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="70%" stop-color="#C9184A" />
      <stop offset="100%" stop-color="#590D22" />
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(158, 125, 82, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#bg-grad)" />
  <rect width="600" height="380" fill="url(#grid)" />

  <!-- Outer Caliber Plate -->
  <circle cx="300" cy="190" r="140" fill="none" stroke="rgba(158, 125, 82, 0.25)" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="300" cy="190" r="125" fill="#181a20" stroke="url(#gold-grad)" stroke-width="2" />

  <!-- Côtes de Genève (Geneva Stripes) Pattern -->
  <g opacity="0.12">
    <line x1="180" y1="90" x2="180" y2="290" stroke="#fff" stroke-width="12" />
    <line x1="210" y1="70" x2="210" y2="310" stroke="#fff" stroke-width="12" />
    <line x1="240" y1="65" x2="240" y2="315" stroke="#fff" stroke-width="12" />
    <line x1="270" y1="65" x2="270" y2="315" stroke="#fff" stroke-width="12" />
    <line x1="300" y1="65" x2="300" y2="315" stroke="#fff" stroke-width="12" />
    <line x1="330" y1="65" x2="330" y2="315" stroke="#fff" stroke-width="12" />
    <line x1="360" y1="65" x2="360" y2="315" stroke="#fff" stroke-width="12" />
    <line x1="390" y1="70" x2="390" y2="310" stroke="#fff" stroke-width="12" />
    <line x1="420" y1="90" x2="420" y2="290" stroke="#fff" stroke-width="12" />
  </g>

  <!-- Kinetic Winding Rotor -->
  <path d="M 200 190 A 100 100 0 0 1 400 190 L 320 190 A 20 20 0 0 0 280 190 Z" fill="url(#steel-grad)" opacity="0.85" stroke="url(#gold-grad)" stroke-width="1.5" />
  
  <!-- Escapement Wheel & Balance Wheel -->
  <circle cx="250" cy="220" r="45" fill="none" stroke="url(#gold-grad)" stroke-width="3" />
  <circle cx="250" cy="220" r="38" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  <circle cx="340" cy="150" r="35" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" stroke-dasharray="6,3" />

  <!-- Synthetic Rubies (Bearing Jewels) -->
  <circle cx="300" cy="190" r="10" fill="url(#jewel-ruby)" stroke="url(#gold-grad)" stroke-width="1.5" />
  <circle cx="250" cy="220" r="7" fill="url(#jewel-ruby)" stroke="url(#gold-grad)" stroke-width="1" />
  <circle cx="340" cy="150" r="6" fill="url(#jewel-ruby)" stroke="url(#gold-grad)" stroke-width="1" />
  <circle cx="360" cy="230" r="5" fill="url(#jewel-ruby)" stroke="url(#gold-grad)" stroke-width="1" />

  <!-- Fine Caliber Engravings -->
  <text x="300" y="55" fill="#BD9865" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">CALIBRE 2824-2 • 28,800 A/H • 25 JEWELS</text>
  <text x="300" y="345" fill="rgba(255,255,255,0.4)" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="2" text-anchor="middle">SWISS LEVER ESCAPEMENT SCHEMATIC</text>
</svg>

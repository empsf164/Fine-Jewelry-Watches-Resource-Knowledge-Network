<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191B22"/>
      <stop offset="50%" stop-color="#1E232E"/>
      <stop offset="100%" stop-color="#12141A"/>
    </linearGradient>
    <linearGradient id="steelBridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="mirrorChamfer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#C8A67B"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#C8A67B"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="woodPeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="url(#bgGradAng)"/>

  <!-- Technical Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="270"/>
    <line x1="160" y1="0" x2="160" y2="270"/>
    <line x1="280" y1="0" x2="280" y2="270"/>
    <line x1="400" y1="0" x2="400" y2="270"/>
    <line x1="0" y1="65" x2="480" y2="65"/>
    <line x1="0" y1="135" x2="480" y2="135"/>
    <line x1="0" y1="205" x2="480" y2="205"/>
  </g>

  <!-- Haute Horlogerie Hand-Finished Movement Bridge -->
  <g transform="translate(180, 135)">
    <!-- Bridge Plate with Côtes de Genève stripes -->
    <path d="M -90 40 Q -40 -30 20 -20 Q 70 -10 110 -60 L 110 50 L -90 50 Z" fill="url(#steelBridge)" stroke="#334155" stroke-width="2"/>
    <!-- Striping Effect -->
    <line x1="-70" y1="30" x2="-60" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="-40" y1="0" x2="-30" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="-10" y1="-10" x2="0" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="20" y1="-20" x2="30" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="50" y1="-20" x2="60" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="80" y1="-40" x2="90" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>

    <!-- 45-Degree Hand-Beveled Chamfer (Anglage Mirror Finish) -->
    <path d="M -90 40 Q -40 -30 20 -20 Q 70 -10 110 -60" fill="none" stroke="url(#mirrorChamfer)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Jewel Sink (Chaton with Ruby) -->
    <circle cx="-30" cy="20" r="14" fill="#C8A67B" stroke="#9E7D52" stroke-width="1.5"/>
    <circle cx="-30" cy="20" r="8" fill="#F43F5E"/>
    <circle cx="-30" cy="20" r="2" fill="#FFFFFF"/>
    <!-- Blued Steel Screw -->
    <circle cx="60" cy="20" r="9" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1"/>
    <line x1="53" y1="20" x2="67" y2="20" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Gentian Wood Polishing Peg / Tool -->
  <g transform="translate(290, 70) rotate(-25)">
    <!-- Wooden Tool Body -->
    <polygon points="0,0 12,-4 90,-20 88,-30 0,-10" fill="url(#woodPeg)" stroke="#92400E" stroke-width="1"/>
    <!-- Diamond Paste at Tip -->
    <circle cx="0" cy="-5" r="4" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1"/>
    <!-- Polishing Sparkle -->
    <polygon points="0,-18 3,-9 12,-6 3,-3 0,6 -3,-3 -12,-6 -3,-9" fill="#FFFFFF"/>
  </g>

  <!-- Technical Readouts -->
  <text x="35" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#DFC298" letter-spacing="1.5">ARTISANAL ANGLAGE &amp; BEVEL POLISHING</text>
  <text x="35" y="245" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">GENTIAN WOOD &amp; 0.5μm DIAMOND COMPOUND • 45° MIRROR BEVEL</text>
  <text x="445" y="245" font-family="'JetBrains Mono', monospace" font-size="10" fill="#DFC298" text-anchor="end">50x MACRO</text>
</svg>

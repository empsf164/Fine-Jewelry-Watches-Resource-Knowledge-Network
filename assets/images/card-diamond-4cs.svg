<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="d4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="diamond-glow-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#BAE6FD" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#d4-bg)" />

  <!-- 4Cs Pillars Layout -->
  <!-- 1. Cut (Top Left) -->
  <g transform="translate(100, 110)">
    <polygon points="0,-40 35,-10 20,40 -20,40 -35,-10" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="0" y="65" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">CUT</text>
    <text x="0" y="80" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">EXCELLENT</text>
  </g>

  <!-- 2. Color (Top Right) -->
  <g transform="translate(235, 110)">
    <circle cx="0" cy="0" r="38" fill="rgba(255,255,255,0.95)" stroke="#FDE047" stroke-width="1.5" />
    <text x="0" y="5" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" text-anchor="middle">D</text>
    <text x="0" y="65" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">COLOR</text>
    <text x="0" y="80" fill="#FDE047" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">COLORLESS</text>
  </g>

  <!-- 3. Clarity (Bottom Left) -->
  <g transform="translate(370, 110)">
    <circle cx="0" cy="0" r="38" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Magnifier reticle crosshair -->
    <line x1="-38" y1="0" x2="38" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="0" y1="-38" x2="0" y2="38" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="2,2" />
    <text x="0" y="5" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">VVS1</text>
    <text x="0" y="65" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">CLARITY</text>
    <text x="0" y="80" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">MICROSCOPIC</text>
  </g>

  <!-- 4. Carat (Bottom Right) -->
  <g transform="translate(500, 110)">
    <rect x="-35" y="-35" width="70" height="70" rx="6" fill="rgba(189, 152, 101, 0.2)" stroke="#BD9865" stroke-width="1.5" />
    <text x="0" y="5" fill="#FDE047" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle">2.00</text>
    <text x="0" y="65" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">CARAT</text>
    <text x="0" y="80" fill="#BD9865" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">0.400 GRAMS</text>
  </g>

  <text x="300" y="325" fill="#BD9865" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">GIA STANDARDIZED 4Cs EVALUATION MATRIX</text>
  <text x="300" y="350" fill="rgba(255,255,255,0.4)" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">10X TO 40X MAGNIFICATION OPTICAL ANALYSIS</text>
</svg>

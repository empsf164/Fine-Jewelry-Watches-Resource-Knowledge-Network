<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJulian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232E"/>
      <stop offset="100%" stop-color="#0E1015"/>
    </linearGradient>
    <linearGradient id="goldJulian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC298"/>
      <stop offset="100%" stop-color="#9E7D52"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="80" fill="url(#bgJulian)"/>
  <circle cx="80" cy="80" r="76" fill="none" stroke="url(#goldJulian)" stroke-width="2"/>
  
  <!-- Stylized Distinguished Gemologist Portrait -->
  <g fill="#C8A67B">
    <!-- Shoulders & Coat -->
    <path d="M 30 150 C 30 120, 50 112, 80 112 C 110 112, 130 120, 130 150 Z" fill="#2A303C"/>
    <!-- Collar & Tie -->
    <polygon points="80,115 72,135 80,145 88,135" fill="url(#goldJulian)"/>
    <polygon points="70,115 80,128 90,115" fill="#FFFFFF"/>
    <!-- Head & Neck -->
    <rect x="72" y="98" width="16" height="18" fill="#E2C7A7"/>
    <ellipse cx="80" cy="74" rx="22" ry="28" fill="#E2C7A7"/>
    <!-- Hair -->
    <path d="M 58 72 C 58 50, 70 42, 80 42 C 92 42, 102 50, 102 68 C 96 60, 85 58, 75 60 C 65 62, 60 66, 58 72 Z" fill="#64748B"/>
    <!-- Spectacles & Gem Loupe -->
    <circle cx="71" cy="73" r="7" fill="none" stroke="#DFC298" stroke-width="1.8"/>
    <circle cx="89" cy="73" r="7" fill="none" stroke="#DFC298" stroke-width="1.8"/>
    <line x1="78" y1="73" x2="82" y2="73" stroke="#DFC298" stroke-width="1.8"/>
    <!-- Lapel Loupe Chain -->
    <path d="M 88 120 C 95 130, 105 132, 108 140" fill="none" stroke="url(#goldJulian)" stroke-width="1.2" stroke-dasharray="2,2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMarcus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241C1A"/>
      <stop offset="100%" stop-color="#140E0C"/>
    </linearGradient>
    <linearGradient id="goldMarcus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC298"/>
      <stop offset="100%" stop-color="#9E7D52"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="80" fill="url(#bgMarcus)"/>
  <circle cx="80" cy="80" r="76" fill="none" stroke="url(#goldMarcus)" stroke-width="2"/>

  <!-- Metallurgist Professor Portrait -->
  <g fill="#C8A67B">
    <!-- Suit & Waistcoat -->
    <path d="M 30 150 C 30 120, 50 112, 80 112 C 110 112, 130 120, 130 150 Z" fill="#292524"/>
    <polygon points="70,112 80,128 90,112" fill="#FFFFFF"/>
    <polygon points="80,118 75,138 80,148 85,138" fill="#B45309"/>
    <!-- Head & Neck -->
    <rect x="72" y="96" width="16" height="18" fill="#DEB887"/>
    <ellipse cx="80" cy="74" rx="22" ry="26" fill="#DEB887"/>
    <!-- Trimmed Beard & Mustache -->
    <path d="M 64 78 C 64 96, 72 102, 80 102 C 88 102, 96 96, 96 78 C 90 84, 86 86, 80 86 C 74 86, 70 84, 64 78 Z" fill="#44403C"/>
    <path d="M 72 82 Q 80 86 88 82" fill="none" stroke="#44403C" stroke-width="3"/>
    <!-- Hair -->
    <path d="M 58 68 C 58 46, 70 42, 80 42 C 92 42, 102 46, 102 68 C 96 56, 85 54, 80 54 C 72 54, 62 58, 58 68 Z" fill="#44403C"/>
    <!-- Eyes & Brows -->
    <path d="M 67 68 Q 72 65 77 68" fill="none" stroke="#1C1917" stroke-width="1.8"/>
    <path d="M 83 68 Q 88 65 93 68" fill="none" stroke="#1C1917" stroke-width="1.8"/>
  </g>
</svg>

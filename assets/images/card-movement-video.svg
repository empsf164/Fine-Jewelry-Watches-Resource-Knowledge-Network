<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="vid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#vid-bg)" />

  <!-- Camera Viewfinder Overlay -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#BD9865" stroke-width="2.5" />
  <path d="M 560 70 L 560 40 L 530 40" fill="none" stroke="#BD9865" stroke-width="2.5" />
  <path d="M 40 310 L 40 340 L 70 340" fill="none" stroke="#BD9865" stroke-width="2.5" />
  <path d="M 560 310 L 560 340 L 530 340" fill="none" stroke="#BD9865" stroke-width="2.5" />

  <!-- Rec Dot Indicator -->
  <circle cx="80" cy="65" r="5" fill="#EF4444" />
  <text x="95" y="69" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">4K REC • 60 FPS MACRO</text>

  <!-- High-Frequency Balance Wheel Centerpiece -->
  <g transform="translate(300, 190)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="rgba(253, 224, 71, 0.2)" stroke-width="6" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#gold-bright)" stroke-width="3" stroke-dasharray="16,8" />
    
    <!-- Balance Arms -->
    <line x1="-85" y1="0" x2="85" y2="0" stroke="url(#gold-bright)" stroke-width="3" />
    <line x1="0" y1="-85" x2="0" y2="85" stroke="url(#gold-bright)" stroke-width="3" />
    
    <!-- Hairspring Spiral -->
    <path d="M 0,0 
      A 5,5 0 0,1 5,0 
      A 10,10 0 0,1 -5,0 
      A 15,15 0 0,1 10,0 
      A 20,20 0 0,1 -15,0 
      A 25,25 0 0,1 20,0 
      A 30,30 0 0,1 -25,0 
      A 35,35 0 0,1 30,0 
      A 40,40 0 0,1 -35,0 
      A 45,45 0 0,1 40,0" fill="none" stroke="#38BDF8" stroke-width="1.8" opacity="0.9" />

    <!-- Center Jewel -->
    <circle cx="0" cy="0" r="10" fill="#E11D48" stroke="#FDE047" stroke-width="1.5" />
  </g>

  <!-- Timegrapher Trace Waveform -->
  <path d="M 120 280 L 180 280 L 190 265 L 200 295 L 210 280 L 390 280 L 400 265 L 410 295 L 420 280 L 480 280" fill="none" stroke="#22C55E" stroke-width="1.5" opacity="0.8" />
  <text x="300" y="325" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">RATE: +1.2 s/d • AMP: 298° • BEAT ERROR: 0.1ms</text>
</svg>

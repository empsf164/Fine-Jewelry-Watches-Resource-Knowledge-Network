<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — AURELIS Knowledge Network</title>
  <meta name="description" content="Access your personalized AURELIS knowledge library, saved checklists, and research archives.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Theme Switcher in Top Right Corner -->
  <div class="auth-theme-corner-btn">
    <button type="button" class="btn-icon-action theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <!-- Standalone Authentication Layout -->
  <div class="auth-page-wrapper">
    <div class="container-custom" style="max-width: 480px;">
      <div class="p-4 p-md-5 bg-surface-custom border border-subtle-custom rounded shadow-lg">
        
        <!-- Brand Name Inside Box Top Center -->
        <div class="d-flex flex-column align-items-center text-center mb-4">
          <a href="index.html" class="brand-logo align-items-center mb-3 text-decoration-none" aria-label="Aurelis Homepage">
            <span class="brand-name">AURELIS</span>
            <span class="brand-tagline-micro">Knowledge Network</span>
          </a>
          <h3 class="mb-1">Sign In to Your Account</h3>
          <p class="small text-secondary mb-0">Access your technical library & research feed</p>
        </div>

        <!-- Quick Demo Fill Helper -->
        <div class="p-2 mb-4 bg-secondary-custom border border-subtle-custom rounded d-flex align-items-center justify-content-between font-ui small">
          <span class="text-muted-custom"><i class="bi bi-person-badge text-bronze me-1"></i> Quick Demo Access:</span>
          <button type="button" class="btn btn-sm btn-link text-bronze p-0 text-decoration-none fw-semibold" id="fillDemoLoginBtn">
            Auto-Fill
          </button>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="aurelis-label" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="aurelis-input" placeholder="collector@aurelis.org" required autocomplete="username">
          </div>

          <div class="mb-3">
            <label class="aurelis-label" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="aurelis-input" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <!-- Remember Me and Forgot Password in the Same Line -->
          <div class="d-flex align-items-center justify-content-between mb-4 small font-ui">
            <label class="d-flex align-items-center gap-2 cursor-pointer mb-0">
              <input type="checkbox" id="rememberMe" class="form-check-input mt-0" checked>
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="text-bronze text-decoration-none">Forgot password?</a>
          </div>

          <button type="submit" class="btn-aurelis btn-aurelis-primary w-100 justify-content-center py-2 mb-3">
            Sign In
          </button>
        </form>

        <!-- Social Divider -->
        <div class="auth-social-divider">
          <span>Or continue with</span>
        </div>

        <!-- Google and Apple Social Icons -->
        <div class="d-flex flex-column gap-2 mb-4">
          <button type="button" class="btn-social-auth" onclick="handleSocialAuth('Google')">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
              <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.1s.7 5.4 1.9 7.8l3.7-2.9z"/>
              <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z"/>
            </svg>
            <span>Continue with Google</span>
          </button>

          <button type="button" class="btn-social-auth" onclick="handleSocialAuth('Apple')">
            <i class="bi bi-apple fs-5"></i>
            <span>Continue with Apple</span>
          </button>
        </div>

        <div class="text-center pt-3 border-top border-subtle-custom small text-secondary">
          Don't have an account yet? <a href="signup.html" class="text-bronze fw-semibold">Create an account</a>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/favorites.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');
      const form = document.getElementById('loginForm');
      const demoBtn = document.getElementById('fillDemoLoginBtn');

      if (demoBtn) {
        demoBtn.addEventListener('click', () => {
          emailInput.value = 'alexander.vance@horology-fellow.org';
          passwordInput.value = 'AurelisMaster2026!';
          AurelisNotifications.show('Demo credentials populated.', 'info');
        });
      }

      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = emailInput.value.trim();
          const password = passwordInput.value;
          const remember = document.getElementById('rememberMe').checked;

          if (email && password) {
            AurelisAuth.login(email, password, remember);
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || 'index.html';
            setTimeout(() => {
              window.location.href = redirect;
            }, 600);
          }
        });
      }
    });

    function handleSocialAuth(provider) {
      AurelisAuth.login(`member@${provider.toLowerCase()}.com`, 'SocialAuthToken2026', true);
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    }
  </script>
</body>
</html>
